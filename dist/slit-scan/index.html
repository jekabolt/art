<body class="site slit">
    <header class="site-bar">
        <a href="/">grbpwr / art</a>
        <span>slit-scan</span>
    </header>

    <main class="slit-main">
        <div class="slit-frame">
            <canvas id="scan" width="640" height="480" aria-label="slit-scan of the camera"></canvas>
            <div id="overlay" class="slit-overlay" hidden>
                <img alt="slit-scan picture — hold to save" />
                <span>hold to save · tap to scan again</span>
            </div>
        </div>
        <div class="slit-bar">
            <span id="status" class="slit-status" aria-live="polite">allow the camera to start</span>
            <button id="save" type="button" class="slit-save" aria-label="save picture">
                <img src="/assets/img/logo/white.png" alt="" width="32" height="32" />
                <span>save</span>
            </button>
        </div>
    </main>
